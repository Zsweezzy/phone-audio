[workspace]
resolver = "2"
members = ["crates/phone-audio-core", "crates/phone-audio-cli", "crates/phone-audio-gui"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"

[profile.release]
strip = true

# Dev artifacts dominate target/ size: full debuginfo across all deps plus
# incremental state grew past 5 GB. Line tables keep panic backtraces useful.
[profile.dev]
debug = "line-tables-only"
incremental = false