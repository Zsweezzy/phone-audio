description = "Phone Audio — small tray-style window to route a Bluetooth phone's audio to this PC"

[dependencies]
phone-audio-core = { path = "../phone-audio-core" }
iced = { version = "0.14", features = ["tokio"] }
tokio = { version = "1", features = ["rt"] }